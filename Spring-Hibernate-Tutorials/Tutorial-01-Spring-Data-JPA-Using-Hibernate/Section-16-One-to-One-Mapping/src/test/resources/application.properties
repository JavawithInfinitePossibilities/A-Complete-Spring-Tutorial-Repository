#jpa configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true


#Spring Boot uses SLF4J as the API and Logback as the default implementation.
# The levels in order from lowest to highest severity:
#TRACE → DEBUG → INFO → WARN → ERROR → FATAL → OFF
#   Level                   Use Case
#   TRACE                   Most detailed — every step, method entry/exit
#   DEBUG                   Diagnostic info — variable values, flow details
#   INFO                    General application events — startup, milestones
#   WARN                    Something unexpected but recoverable
#   ERROR                   Failures that need attention
#   FATAL                   Severe error, app may crash (rarely used directly)
#   OFF                     Disables logging completely
#How the hierarchy works
#When you set a level, it shows that level AND everything above it:
#   •   Set INFO → you see INFO, WARN, ERROR
#   •   Set DEBUG → you see DEBUG, INFO, WARN, ERROR
#   •   Set WARN → you see only WARN, ERROR

logging.file.name=./src/main/resources/log/app.log
logging.level.root=info
logging.level.org.springframework.web=info
logging.level.org.hibernate=error
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.logback.rollingpolicy.file-name-pattern=app.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=10MB
logging.logback.pattern.file=%d %p %c{1.} [%t] %m%n
logging.logback.pattern.console=%d{HH:mm:ss} [%t] %-5level %logger{36} - %msg%n



