<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Book — NextGen LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css" />
</head>
<body>

    <!-- ── Top Navigation Bar ───────────────────────────── -->
    <header class="navbar">
        <div class="navbar-brand">
            <span class="navbar-icon">📚</span>
            <span class="navbar-title">NextGen LMS</span>
        </div>
        <nav class="navbar-links">
            <a th:href="@{/}"        class="nav-link">🏠 Home</a>
            <a th:href="@{/}"        class="nav-link nav-link--active">📖 Books</a>
            <a th:href="@{/members}" class="nav-link">👥 Members</a>
            <a th:href="@{/borrow}"  class="nav-link">🤝 Borrow</a>
            <a th:href="@{/return}"  class="nav-link">↩️ Return</a>
        </nav>
    </header>

    <!-- ── Page Content ─────────────────────────────────── -->
    <main class="page-content">

        <!-- Breadcrumb -->
        <nav class="breadcrumb">
            <a th:href="@{/}">📖 Books</a>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current">Add New Book</span>
        </nav>

        <!-- Form Card -->
        <div class="form-card">

            <div class="form-card-header">
                <span class="form-card-icon">➕</span>
                <div>
                    <h1 class="form-title">Add New Book</h1>
                    <p class="form-subtitle">Fill in the details below to add a book to the catalogue.</p>
                </div>
            </div>

            <!--
                th:action  → POST to /books (context-path prepended automatically)
                th:object  → binds form fields to the 'book' model attribute
            -->
            <form th:action="@{/books}" th:object="${book}" method="post" novalidate>

                <div class="form-group">
                    <label for="title">Book Title <span class="required">*</span></label>
                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           placeholder="e.g. The Pragmatic Programmer"
                           required />
                </div>

                <div class="form-group">
                    <label for="author">Author <span class="required">*</span></label>
                    <input type="text"
                           id="author"
                           th:field="*{author}"
                           placeholder="e.g. Andrew Hunt"
                           required />
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN <span class="required">*</span></label>
                    <input type="text"
                           id="isbn"
                           th:field="*{isbn}"
                           placeholder="e.g. 978-0-13-468599-1"
                           required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        📥 Save Book
                    </button>
                    <a th:href="@{/}" class="btn btn-secondary btn-block">
                        ✕ Cancel
                    </a>
                </div>

            </form>
        </div>

    </main>

    <!-- ── Footer ───────────────────────────────────────── -->
    <footer class="footer">
        <p class="footer-text">© 2026 NextGen Library Management System</p>
    </footer>

</body>
</html>
