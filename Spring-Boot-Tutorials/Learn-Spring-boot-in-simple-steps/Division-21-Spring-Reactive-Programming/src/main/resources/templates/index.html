<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spring Reactive Programming for Vaccine Delivery System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #1a73e8;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .table-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background-color: #1a73e8;
            color: #ffffff;
        }

        thead th {
            padding: 14px 20px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        tbody tr {
            border-bottom: 1px solid #e8edf2;
            transition: background-color 0.2s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f0f7ff;
        }

        tbody td {
            padding: 13px 20px;
            font-size: 0.92rem;
            color: #444;
        }

        tbody tr:nth-child(even) {
            background-color: #f7fafd;
        }

        tbody tr:nth-child(even):hover {
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>

    <h1>Spring Reactive Programming &mdash; Vaccine Delivery System</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Manufacturer</th>
                    <th>Delivered</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="vaccine : ${vaccines}">
                    <td th:text="${vaccine.name}"></td>
                    <td th:text="${vaccine.manufacturer}"></td>
                    <td th:text="${vaccine.delivered}"></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
