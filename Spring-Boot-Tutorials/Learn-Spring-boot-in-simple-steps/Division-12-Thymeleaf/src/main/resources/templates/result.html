<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Saved</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 48px 56px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1a237e;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #607d8b;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .detail-card {
            background-color: #f5f7ff;
            border-radius: 10px;
            padding: 24px 28px;
            text-align: left;
            margin-bottom: 32px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e8eaf6;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #7986cb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 1rem;
            color: #37474f;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #1a237e;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #283593;
        }

        .btn-secondary {
            background-color: #e8eaf6;
            color: #1a237e;
        }

        .btn-secondary:hover {
            background-color: #c5cae9;
        }

        footer {
            margin-top: 36px;
            font-size: 0.78rem;
            color: #b0bec5;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="success-icon">✅</div>
        <div class="badge">Saved Successfully</div>

        <h1>Student Record Saved</h1>
        <p class="subtitle">The following details were submitted and saved.</p>

        <div class="detail-card">
            <div class="detail-row">
                <span class="detail-label">Roll No</span>
                <span class="detail-value" th:text="${student.id}">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Name</span>
                <span class="detail-value" th:text="${student.name}">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Score</span>
                <span class="detail-value" th:text="${student.score}">—</span>
            </div>
        </div>

        <div class="actions">
            <a th:href="@{/studentform}" class="btn btn-secondary">&#8592; Back to Form</a>
            <a th:href="@{/}" class="btn btn-primary">&#8962; Home</a>
        </div>

        <footer>Division-12-Thymeleaf &mdash; Spring Boot Tutorials</footer>

    </div>
</body>
</html>
