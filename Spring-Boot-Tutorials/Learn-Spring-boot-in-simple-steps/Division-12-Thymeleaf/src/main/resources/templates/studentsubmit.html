<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 48px 16px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 48px 56px;
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .badge {
            display: inline-block;
            background-color: #fce4ec;
            color: #880e4f;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1a237e;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #607d8b;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #7986cb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            padding: 12px 16px;
            border: 1.5px solid #e8eaf6;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #37474f;
            background-color: #f5f7ff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
            background-color: #ffffff;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 13px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #1a237e;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #283593;
        }

        .btn-reset {
            background-color: #e8eaf6;
            color: #1a237e;
        }

        .btn-reset:hover {
            background-color: #c5cae9;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .nav-link {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            background-color: #e8eaf6;
            color: #1a237e;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .nav-link:hover {
            background-color: #c5cae9;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 36px;
            font-size: 0.78rem;
            color: #b0bec5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="badge">th:object &amp; th:field Demo</div>
            <h1>Student Form</h1>
            <p class="subtitle">Fill in the details and submit to save</p>
        </div>

        <form th:action="@{/studentsave}" th:object="${student}" method="post">

            <div class="form-group">
                <label for="id">Roll No</label>
                <input type="text" id="id" th:field="*{id}" placeholder="Enter roll number" />
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter student name" />
            </div>

            <div class="form-group">
                <label for="score">Score</label>
                <input type="text" id="score" th:field="*{score}" placeholder="Enter score" />
            </div>

            <div class="form-actions">
                <input type="reset" value="Reset" class="btn btn-reset" />
                <input type="submit" value="Save Student" class="btn btn-primary" />
            </div>

        </form>

        <div class="nav-links">
            <a th:href="@{/students}" class="nav-link">All Students</a>
            <a th:href="@{/}" class="nav-link">&#8962; Home</a>
        </div>

        <footer>Division-12-Thymeleaf &mdash; Spring Boot Tutorials</footer>

    </div>
</body>
</html>
