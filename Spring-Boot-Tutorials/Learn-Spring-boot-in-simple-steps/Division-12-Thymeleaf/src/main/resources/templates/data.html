<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from Server</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 48px 56px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            background-color: #e3f2fd;
            color: #1565c0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.6rem;
            color: #1a237e;
            margin-bottom: 28px;
        }

        .message-box {
            background-color: #f5f5f5;
            border-left: 5px solid #1a237e;
            border-radius: 8px;
            padding: 20px 24px;
            font-size: 1.1rem;
            color: #37474f;
            font-style: italic;
            text-align: left;
            margin-bottom: 36px;
        }

        .message-box::before {
            content: '\201C';
            font-size: 2.5rem;
            color: #1a237e;
            line-height: 0;
            vertical-align: -0.5rem;
            margin-right: 6px;
        }

        .back-link {
            display: inline-block;
            padding: 12px 28px;
            background-color: #1a237e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .back-link:hover {
            background-color: #283593;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 36px;
            font-size: 0.78rem;
            color: #b0bec5;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="badge">ModelAndView Demo</div>

        <h1>Message from the Server</h1>

        <div class="message-box" th:text="${Message}">
            Your message will appear here.
        </div>

        <a th:href="@{/}" class="back-link">&#8592; Back to Home</a>

        <footer>Division-12-Thymeleaf &mdash; Spring Boot Tutorials</footer>

    </div>
</body>
</html>
