<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 48px 16px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 48px 56px;
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .badge {
            display: inline-block;
            background-color: #fff3e0;
            color: #e65100;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1a237e;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #607d8b;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
        }

        thead tr {
            background-color: #1a237e;
            color: #ffffff;
        }

        thead th {
            padding: 14px 18px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        thead th:first-child {
            border-radius: 8px 0 0 0;
        }

        thead th:last-child {
            border-radius: 0 8px 0 0;
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #e8eaf6;
            transition: background-color 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f5f7ff;
        }

        tbody td {
            padding: 14px 18px;
            color: #37474f;
            font-size: 0.95rem;
        }

        tbody td:last-child {
            text-align: center;
        }

        .avatar-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #1a237e;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .score-pill {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #1a237e;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #283593;
        }

        .btn-secondary {
            background-color: #e8eaf6;
            color: #1a237e;
        }

        .btn-secondary:hover {
            background-color: #c5cae9;
        }

        footer {
            margin-top: 36px;
            font-size: 0.78rem;
            color: #b0bec5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="badge">th:each Demo</div>
            <h1>All Students</h1>
            <p class="subtitle">List of all registered student records</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}">—</td>
                    <td>
                        <div class="avatar-cell">
                            <div class="avatar"
                                 th:text="${#strings.toUpperCase(#strings.substring(student.name, 0, 1))}">A</div>
                            <span th:text="${student.name}">—</span>
                        </div>
                    </td>
                    <td>
                        <span class="score-pill" th:text="${student.score}">—</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="actions">
            <a th:href="@{/student}" class="btn btn-secondary">Single Student</a>
            <a th:href="@{/}" class="btn btn-primary">&#8962; Home</a>
        </div>

        <footer>Division-12-Thymeleaf &mdash; Spring Boot Tutorials</footer>

    </div>
</body>
</html>
