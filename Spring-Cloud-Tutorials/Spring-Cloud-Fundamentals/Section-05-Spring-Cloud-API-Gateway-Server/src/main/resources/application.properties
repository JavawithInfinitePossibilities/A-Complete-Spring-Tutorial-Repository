server.port=9091
spring.application.name=apigateway-services

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
spring.cloud.discovery.enabled=true

#spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-name=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-name=true

#===========================================================
# With discovery locator enabled, explicit routes below are NOT needed.
# The gateway will auto-create routes for all services registered in Eureka.
# Example auto-generated routes:
#   /coupon-services/** → lb://coupon-services
#   /product-services/** → lb://product-services
#===========================================================
#You're using Spring Cloud 2025.0.3. In this version:
#•spring-cloud-starter-gateway now contains two modules:
#◦spring-cloud-gateway-server-webflux (reactive, the standard one)
#◦spring-cloud-gateway-server-mvc (servlet-based, newer option)
#•The old property prefix spring.cloud.gateway.routes[*] was renamed to
#   spring.cloud.gateway.server.webflux.routes[*]
#•Also, route index must be contiguous — you have [0], skip [1], then [2],
#   which causes the "left unbound" binding failure
#===========================================================
spring.cloud.gateway.server.webflux.routes[0].id=productModule
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICES
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/productcart/productdetails/**

#spring.cloud.gateway.server.webflux.routes[1].id=productModuleRaw
#spring.cloud.gateway.server.webflux.routes[1].uri=lb://product-services
#spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/productcart/**

spring.cloud.gateway.server.webflux.routes[1].id=couponModule
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COUPON-SERVICES
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/couponcart/couponapi/**



