server.port=9091
spring.application.name=apigateway-services

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
#spring.cloud.discovery.enabled=true

#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-name=true

#===========================================================
# With discovery locator enabled, explicit routes below are NOT needed.
# The gateway will auto-create routes for all services registered in Eureka.
# Example auto-generated routes:
#   /coupon-services/** → lb://coupon-services
#   /product-services/** → lb://product-services
#===========================================================
spring.cloud.gateway.routes[0].id=productModule
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICES
spring.cloud.gateway.routes[0].predicates[0]=Path=/productcart/productdetails/**

spring.cloud.gateway.routes[1].id=productModuleRaw
spring.cloud.gateway.routes[1].uri=lb://product-services
spring.cloud.gateway.routes[1].predicates[0]=Path=/productcart/**

spring.cloud.gateway.routes[2].id=couponModule
spring.cloud.gateway.routes[2].uri=lb://COUPON-SERVICES
spring.cloud.gateway.routes[2].predicates[0]=Path=/couponcart/couponapi/**



