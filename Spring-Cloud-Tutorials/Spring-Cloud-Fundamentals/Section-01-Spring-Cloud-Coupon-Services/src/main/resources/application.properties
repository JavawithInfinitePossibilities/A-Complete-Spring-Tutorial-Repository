spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mydb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

#jpa configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

server.port=8080
server.servlet.context-path=/couponcart
spring.application.name=coupon-services

#What it does:
#•When true — enables all service discovery auto-configuration.
# The app will register itself with the Eureka server and discover other services through it.
#•When false — disables service discovery entirely,
# even if Eureka client dependencies are on the classpath. The Eureka-related beans won't be created.
# Disable discovery in local/dev profile without removing Eureka dependency
spring.cloud.discovery.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# register this service with Eureka
eureka.client.register-with-eureka=true
# fetch the registry of other services
eureka.client.fetch-registry=true
#The instance id is the combination of the application name and the port number.
#This will be used by Eureka to identify the instance which will help in load balancing and discovery the services.
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

#Root cause: Zipkin server is not running.
#Your app has opentelemetry-exporter-zipkin in the pom,
# which means Spring Boot auto-configures tracing and tries to export spans to Zipkin at
# its default URL — http://localhost:9411/api/v2/spans. Since no Zipkin server is running there,
# it throws ConnectException.
#This is just a background tracing export failure — your app itself is running fine. It's not a startup crash.
management.zipkin.tracing.export.enabled=false
management.tracing.enabled=false
