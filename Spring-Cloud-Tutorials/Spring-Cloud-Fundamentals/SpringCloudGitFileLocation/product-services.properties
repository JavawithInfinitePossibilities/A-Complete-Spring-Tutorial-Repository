management.security.enabled=false
com.sid.tutorial.springboot.cloud.custom.prop=myproperty2
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mydb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

#jpa configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

server.port=9090
server.servlet.context-path=/productcart
spring.application.name=product-services

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

#spring.cloud.discovery.enabled=true
resilience4j.retry.instances.product-api-retry.max-attempts=2
resilience4j.retry.instances.product-api-retry.wait-duration=3s