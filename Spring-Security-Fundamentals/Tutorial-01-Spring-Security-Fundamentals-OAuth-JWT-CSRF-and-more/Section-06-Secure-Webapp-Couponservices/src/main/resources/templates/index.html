<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coupon Home</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.home-container {
			width: 100%;
			max-width: 520px;
			padding: 20px;
		}
		.home-card {
			background: white;
			border-radius: 14px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.18);
			overflow: hidden;
		}
		.home-header {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			padding: 28px 20px;
			text-align: center;
		}
		.home-header h2 {
			font-size: 24px;
			margin: 0;
			letter-spacing: 0.4px;
			font-weight: 700;
		}
		.home-body {
			padding: 32px 28px;
			text-align: center;
		}
		.home-body p {
			color: #444;
			margin-bottom: 18px;
			font-size: 15px;
		}
		.action-btn {
			display: inline-block;
			width: 100%;
			max-width: 360px;
			margin: 8px auto;
			padding: 12px 16px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			text-decoration: none;
			border-radius: 9px;
			font-weight: 600;
			transition: transform .18s ease, box-shadow .18s ease;
			box-shadow: 0 6px 18px rgba(102,126,234,0.25);
		}
		.action-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(102,126,234,0.30); }
		.secondary-link { display: inline-block; margin-top: 12px; color: #667eea; text-decoration: none; font-weight: 600; }
		.home-footer { padding: 18px 24px; text-align: center; background: #fbfbfb; border-top: 1px solid #eee; font-size: 14px; color: #666; }
		@media (max-width: 480px) { .home-body { padding: 24px 18px; } .home-header h2 { font-size: 20px; } }
	</style>
</head>
<body>
<div class="home-container">
	<div class="home-card">
		<div class="home-header">
			<h2>🎟️ Coupon Service</h2>
		</div>
		<div class="home-body">
			<p>Welcome! Choose an action below to manage coupons.</p>

			<a class="action-btn" href="/Section-06-Secure-Webapp-Couponservices/showCreateCoupon">Create Coupon</a>
			<a class="action-btn" href="/Section-06-Secure-Webapp-Couponservices/showGetCoupon">Get Coupon</a>
			<a class="action-btn" href="/Section-06-Secure-Webapp-Couponservices/logout">Logout</a>

			<div style="margin-top:14px;">
				<a class="secondary-link" href="/Section-06-Secure-Webapp-Couponservices/showReg">Register a new user</a>
			</div>
		</div>
		<div class="home-footer">
			<span>Secure Webapp — Couponservices</span>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
