<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupon Created</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .response-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .response-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .response-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .response-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .response-body {
            padding: 40px;
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .success-message {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .success-subtext {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }

        .action-btn {
            display: inline-block;
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .response-footer {
            padding: 20px 40px;
            text-align: center;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        .response-footer p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .response-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            margin-left: 5px;
        }

        .response-footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .response-card {
                border-radius: 10px;
            }

            .response-body {
                padding: 30px 20px;
            }

            .response-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="response-container">
    <div class="response-card">
        <div class="response-header">
            <h2>🎟️ Coupon Service</h2>
        </div>
        <div class="response-body">
            <div class="success-icon">✅</div>
            <p class="success-message">Coupon Created Successfully!</p>
            <p class="success-subtext">Your coupon has been saved and is ready to use.</p>
            <a class="action-btn" href="/Section-06-Secure-Webapp-Couponservices/showCreateCoupon">Create Another Coupon</a>
            <a class="action-btn" href="/Section-06-Secure-Webapp-Couponservices/">Back to Home</a>
        </div>
        <div class="response-footer">
            <p>Secure Webapp — <a href="/Section-06-Secure-Webapp-Couponservices/">Coupon Services</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
