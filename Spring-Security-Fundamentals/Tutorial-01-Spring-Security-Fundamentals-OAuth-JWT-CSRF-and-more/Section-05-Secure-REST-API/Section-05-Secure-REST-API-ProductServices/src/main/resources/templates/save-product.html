<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add Product</title>
    <link rel="stylesheet" th:href="@{/css/product.css}"/>
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <a class="brand" th:href="@{/productapi/}">🛒 Product Manager</a>
    <nav>
        <a th:href="@{/productapi/}">Home</a>
        <a th:href="@{/productapi/save}">Add Product</a>
        <a th:href="@{/productapi/search}">Search</a>
    </nav>
</header>

<div class="container">
    <h1 class="page-title">Add New Product</h1>

    <!-- Error flash -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <!--
            Binds to the empty Product object added by the controller.
            On submit, POST /productapi/saveproduct
        -->
        <form id="saveProductForm"
              th:action="@{/productapi/saveProduct}"
              th:object="${product}"
              method="post">

            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="e.g. Laptop"/>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text"
                       id="description"
                       th:field="*{description}"
                       placeholder="e.g. High-performance laptop"/>
            </div>

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number"
                       id="price"
                       th:field="*{price}"
                       step="0.01"
                       min="0.01"
                       placeholder="e.g. 49999.00"/>
            </div>

            <div class="form-group">
                <label for="couponCode">Coupon Code</label>
                <input type="text"
                       id="couponCode"
                       th:field="*{couponCode}"
                       placeholder="e.g. SAVE10"/>
            </div>

            <button type="submit" class="btn btn-primary">💾 Save Product</button>
            <a th:href="@{/productapi/}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<script th:src="@{/js/product.js}"></script>
</body>
</html>
