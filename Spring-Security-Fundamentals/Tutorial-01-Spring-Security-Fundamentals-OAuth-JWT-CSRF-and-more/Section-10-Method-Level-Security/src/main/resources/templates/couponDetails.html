<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupon Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .details-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .details-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .details-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .details-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .details-body {
            padding: 40px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 14px;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .badge-code {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            text-align: center;
            margin-top: 28px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .details-footer {
            padding: 20px 40px;
            text-align: center;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        .details-footer p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .details-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            margin-left: 5px;
        }

        .details-footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .details-card {
                border-radius: 10px;
            }

            .details-body {
                padding: 30px 20px;
            }

            .details-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="details-container">
    <div class="details-card">
        <div class="details-header">
            <h2>🎟️ Coupon Details</h2>
        </div>
        <div class="details-body">
            <div class="detail-row">
                <span class="detail-label">Coupon Code</span>
                <span class="badge-code" th:text="${coupon.code}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Discount</span>
                <span class="detail-value" th:text="${coupon.discount}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Expiry Date</span>
                <span class="detail-value" th:text="${coupon.expDate}"></span>
            </div>
            <a class="action-btn" href="/Section-06-Secure-Webapp-Couponservices/showGetCoupon">Search Another Coupon</a>
        </div>
        <div class="details-footer">
            <p>Back to <a href="/Section-06-Secure-Webapp-Couponservices/">Home</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
